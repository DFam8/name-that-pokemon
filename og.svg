<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <rect width="1200" height="630" fill="#0f1117"/>

  <!-- Poké Ball decoration -->
  <circle cx="960" cy="315" r="340" fill="none" stroke="#1a1d27" stroke-width="2"/>
  <circle cx="960" cy="315" r="260" fill="#1a1d27" opacity="0.6"/>
  <line x1="700" y1="315" x2="1200" y2="315" stroke="#2e3347" stroke-width="3"/>
  <circle cx="960" cy="315" r="55" fill="#0f1117" stroke="#2e3347" stroke-width="3"/>
  <circle cx="960" cy="315" r="32" fill="#5b7cfa"/>

  <!-- Top half of ball -->
